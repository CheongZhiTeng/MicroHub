name: Deploy MicroHub website

on:
  push:
    branches: [codex/github-pages]

permissions:
  contents: read

concurrency:
  group: microhub-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:pages
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Mark the build with its source commit
        run: printf '%s\n' "$GITHUB_SHA" > dist/pages/microhub-release.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        id: pages
      - name: Check the published base path
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: test "$PAGES_BASE" = "/MicroHub"
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the published homepage, sign-in and groups routes
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          release_url="${PAGES_URL%/}/microhub-release.txt"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 8 \
                "$release_url?commit=$GITHUB_SHA" -o "$RUNNER_TEMP/microhub-release.txt" &&
               grep -Fxq "$GITHUB_SHA" "$RUNNER_TEMP/microhub-release.txt"; then
              echo "Published commit verified at $release_url"
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "::error::The published site did not report commit $GITHUB_SHA."
              exit 1
            fi
            sleep 5
          done
          for route in '' 'sign-in/' 'groups/' 'events/' 'announcements/' 'homework/' 'assignment/' 'notifications/' 'profile/' 'announcement-editor/' 'event-editor/' 'assignment-editor/' 'attendance/' 'attendance-new/' 'attendance-session/' 'club-admin/'; do
            url="${PAGES_URL%/}/${route}"
            matched=false
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --location --max-time 8 \
                    --output "$RUNNER_TEMP/microhub-page.html" "$url" &&
                 grep -Fq '/MicroHub/_expo/static/js/web/entry-' "$RUNNER_TEMP/microhub-page.html"; then
                echo "Expo app verified at $url"
                matched=true
                break
              fi
              sleep 5
            done
            if [[ "$matched" != true ]]; then
              echo "::error::The published page at $url did not serve the Expo app."
              exit 1
            fi
          done
