project_id = "microhub"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["microhub://auth/callback"]
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

[functions.review-membership]
# Handler verifies the token with Auth; supports current publishable keys.
verify_jwt = false

[functions.homework-files]
verify_jwt = false

[functions.delete-group]
# Auth checks the caller's session and verifies the current password in the handler.
verify_jwt = false
